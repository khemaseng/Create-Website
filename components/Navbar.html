<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TechSkills Navbar</title>

<script src="https://cdn.tailwindcss.com"></script>

<script>
tailwind.config = {
  darkMode: 'class'
}
</script>
</head>

<body class="bg-gray-100 dark:bg-gray-900 transition-colors duration-300">

<!-- NAVBAR -->
<nav class="fixed top-0 w-full z-50 bg-white dark:bg-gray-800 shadow-md border-b border-gray-200 dark:border-gray-700">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">

    <!-- LOGO -->
    <a href="#" class="text-2xl font-bold text-[#00FA9A]">
      TechSkills
    </a>

    <!-- DESKTOP MENU -->
    <ul class="hidden lg:flex items-center gap-8 text-gray-700 dark:text-gray-200 font-medium">
      <li><a class="hover:text-[#00FA9A]" href="#">Home</a></li>
      <li><a class="hover:text-[#00FA9A]" href="#">Courses</a></li>
      <li><a class="hover:text-[#00FA9A]" href="#">Details</a></li>
      <li><a class="hover:text-[#00FA9A]" href="#">About</a></li>
      <li><a class="hover:text-[#00FA9A]" href="#">Contact</a></li>
    </ul>

    <!-- RIGHT SIDE -->
    <div class="flex items-center gap-3">

      <!-- DARK MODE TOGGLE -->
      <button id="theme-toggle"
        class="w-12 h-6 flex items-center bg-gray-300 dark:bg-gray-600 rounded-full p-1 transition">
        <div id="toggle-circle"
          class="w-4 h-4 bg-white rounded-full shadow-md transition-transform duration-300">
        </div>
      </button>

      <!-- LOGIN -->
      <a href="#" class="hidden sm:block text-gray-700 dark:text-gray-200 hover:text-[#00FA9A] text-sm">
        Login
      </a>

      <!-- SIGN UP -->
      <a href="#" class="hidden sm:block bg-[#00FA9A] hover:bg-[#00d487] text-black px-4 py-2 rounded-lg text-sm font-medium">
        Sign Up
      </a>

      <!-- MOBILE BUTTON -->
      <button id="menu-btn" class="lg:hidden p-2 rounded-md hover:bg-gray-100 dark:hover:bg-gray-700">
        <svg class="w-6 h-6 text-gray-700 dark:text-white" fill="none" stroke="currentColor" stroke-width="2"
          viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>

    </div>
  </div>

  <!-- MOBILE MENU OVERLAY -->
  <div id="overlay" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm"></div>

  <!-- MOBILE MENU -->
  <div id="mobile-menu"
    class="lg:hidden fixed top-0 left-0 w-full bg-white dark:bg-gray-800 shadow-lg transform -translate-y-full transition-transform duration-300">

    <div class="px-6 py-6 flex flex-col gap-5 text-gray-700 dark:text-gray-200 font-medium">

      <a href="#" class="hover:text-[#00FA9A]">Home</a>
      <a href="#" class="hover:text-[#00FA9A]">Courses</a>
      <a href="#" class="hover:text-[#00FA9A]">Details</a>
      <a href="#" class="hover:text-[#00FA9A]">About</a>
      <a href="#" class="hover:text-[#00FA9A]">Contact</a>

      <div class="border-t pt-4 flex flex-col gap-3">
        <a href="#">Login</a>
        <a href="#" class="text-[#00FA9A] font-semibold">Sign Up</a>
      </div>

    </div>
  </div>
</nav>

<!-- SPACER -->
<div class="h-20"></div>

<!-- SCRIPT -->
<script>
const menuBtn = document.getElementById("menu-btn");
const mobileMenu = document.getElementById("mobile-menu");
const overlay = document.getElementById("overlay");

function openMenu() {
  mobileMenu.classList.remove("-translate-y-full");
  overlay.classList.remove("hidden");
}

function closeMenu() {
  mobileMenu.classList.add("-translate-y-full");
  overlay.classList.add("hidden");
}

menuBtn.addEventListener("click", openMenu);
overlay.addEventListener("click", closeMenu);

// DARK MODE
const toggle = document.getElementById("theme-toggle");
const circle = document.getElementById("toggle-circle");

if (localStorage.getItem("theme") === "dark") {
  document.documentElement.classList.add("dark");
  circle.classList.add("translate-x-6");
}


toggle.addEventListener("click", () => {
  document.documentElement.classList.toggle("dark");

  if (document.documentElement.classList.contains("dark")) {
    localStorage.setItem("theme", "dark");
    circle.classList.add("translate-x-6");
  } else {
    localStorage.setItem("theme", "light");
    circle.classList.remove("translate-x-6");
  }
});
</script>

</body>
</html>
