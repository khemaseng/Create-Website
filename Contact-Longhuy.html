<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
    <link rel="stylesheet" href="./src/output.css" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              accent: {
                DEFAULT: "#c8773a",
                hover: "#a85e25",
              },
              cream: "#faf8f4",
              ink: {
                DEFAULT: "#1a1714",
                light: "#4a4540",
                muted: "#9a9088",
              },
            },
          },
        },
      };
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Roboto", sans-serif;
        line-height: 1.6;
      }
      .info-item:hover {
        transform: translateX(4px);
      }
      .social-btn:hover {
        transform: translateY(-3px);
      }
      .social-btn:active {
        transform: translateY(-1px);
      }
      .send-btn:hover {
        transform: translateY(-2px);
      }
      .send-btn:active {
        transform: none;
        box-shadow: none;
      }

      .btn-telegram:hover {
        background-color: #0088cc;
        border-color: #0088cc;
      }
      .btn-tiktok:hover {
        background: linear-gradient(135deg, #010101, #69c9d0, #ee1d52);
        border-color: #69c9d0;
      }
      .btn-messenger:hover {
        background: linear-gradient(135deg, #0099ff, #a033ff);
        border-color: #0099ff;
      }
      .btn-whatsapp:hover {
        background-color: #25d366;
        border-color: #25d366;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .fade-in {
        animation: fadeIn 0.4s ease;
      }
    </style>
  </head>

  <body
    class="min-h-screen bg-cream font-sans flex items-center justify-center p-4 md:p-8"
  >
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
      <div
        class="absolute -top-20 -left-20 w-96 h-96 rounded-full opacity-50"
        style="background: radial-gradient(circle, #f0e8dc, transparent)"
      ></div>
      <div
        class="absolute -bottom-20 -right-20 w-96 h-96 rounded-full opacity-40"
        style="background: radial-gradient(circle, #e8f0e4, transparent)"
      ></div>
    </div>

    <div
      class="relative z-10 w-full max-w-4xl bg-white rounded-3xl shadow-2xl border border-stone-200 overflow-hidden grid grid-cols-1 md:grid-cols-2"
    >
      <!-- ── LEFT: Info panel ── -->
      <div
        class="relative bg-ink text-white p-8 md:p-10 flex flex-col gap-8 overflow-hidden"
      >
        <div
          class="absolute -top-14 -right-14 w-48 h-48 rounded-full bg-accent opacity-10 pointer-events-none"
        ></div>
        <div
          class="absolute -bottom-10 -left-10 w-36 h-36 rounded-full bg-accent opacity-10 pointer-events-none"
        ></div>

        <!-- Header -->
        <div class="relative z-10">
          <span
            class="inline-block bg-accent bg-opacity-20 text-accent text-xs font-semibold tracking-widest uppercase px-3 py-1 rounded-full mb-4"
          >
            Get in touch
          </span>
          <h1
            class="font-serif text-3xl md:text-4xl font-medium leading-tight mb-2"
          >
            We'd love to<br />hear from you
          </h1>
          <p class="text-white text-opacity-50 text-sm leading-relaxed">
            Reach out anytime — we respond within 24 hours.
          </p>
        </div>

        <!-- Contact info -->
        <div class="relative z-10 flex flex-col gap-3">
          <!-- Phone -->
          <div
            class="info-item flex items-center gap-4 px-4 py-3 rounded-xl border border-white border-opacity-10 bg-white bg-opacity-5 transition-all duration-300 cursor-default hover:bg-accent hover:bg-opacity-10 hover:border-accent hover:border-opacity-30"
          >
            <div
              class="w-10 h-10 rounded-xl bg-accent bg-opacity-20 flex items-center justify-center shrink-0"
            >
              <svg
                class="w-4 h-4 fill-accent"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 640 640"
              >
                <path
                  d="M224.2 89C216.3 70.1 195.7 60.1 176.1 65.4L170.6 66.9C106 84.5 50.8 147.1 66.9 223.3C104 398.3 241.7 536 416.7 573.1C493 589.3 555.5 534 573.1 469.4L574.6 463.9C580 444.2 569.9 423.6 551.1 415.8L453.8 375.3C437.3 368.4 418.2 373.2 406.8 387.1L368.2 434.3C297.9 399.4 241.3 341 208.8 269.3L253 233.3C266.9 222 271.6 202.9 264.8 186.3L224.2 89z"
                />
              </svg>
            </div>
            <div>
              <p
                class="text-white text-opacity-40 text-xs tracking-wide mb-0.5"
              >
                Phone
              </p>
              <p class="text-white text-opacity-90 text-sm font-medium">
                099 9999 999
              </p>
            </div>
          </div>

          <!-- Email -->
          <div
            class="info-item flex items-center gap-4 px-4 py-3 rounded-xl border border-white border-opacity-10 bg-white bg-opacity-5 transition-all duration-300 cursor-default hover:bg-accent hover:bg-opacity-10 hover:border-accent hover:border-opacity-30"
          >
            <div
              class="w-10 h-10 rounded-xl bg-accent bg-opacity-20 flex items-center justify-center shrink-0"
            >
              <svg
                class="w-4 h-4 fill-accent"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 512 512"
              >
                <path
                  d="M48 64C21.5 64 0 85.5 0 112c0 15.1 7.1 29.3 19.2 38.4L236.8 313.6c11.4 8.5 27 8.5 38.4 0L492.8 150.4c12.1-9.1 19.2-23.3 19.2-38.4c0-26.5-21.5-48-48-48L48 64zM0 176L0 384c0 35.3 28.7 64 64 64l384 0c35.3 0 64-28.7 64-64l0-208L294.4 339.2c-22.8 17.1-54 17.1-76.8 0L0 176z"
                />
              </svg>
            </div>
            <div>
              <p
                class="text-white text-opacity-40 text-xs tracking-wide mb-0.5"
              >
                Email
              </p>
              <p class="text-white text-opacity-90 text-sm font-medium">
                abc123@gmail.com
              </p>
            </div>
          </div>
        </div>

        <!-- Social buttons -->
        <div class="relative z-10">
          <p
            class="text-white text-opacity-40 text-xs tracking-widest uppercase mb-3"
          >
            Find us on
          </p>
          <div class="grid grid-cols-4 gap-2">
            <!-- Telegram -->
            <a
              href="#"
              class="social-btn btn-telegram flex flex-col items-center justify-center gap-1.5 py-3 px-1 rounded-xl border border-white border-opacity-10 bg-white bg-opacity-5 text-white text-opacity-70 hover:text-white text-xs font-medium transition-all duration-300 hover:shadow-xl no-underline"
            >
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"
                />
              </svg>
              <span>Telegram</span>
            </a>

            <!-- TikTok -->
            <a
              href="#"
              class="social-btn btn-tiktok flex flex-col items-center justify-center gap-1.5 py-3 px-1 rounded-xl border border-white border-opacity-10 bg-white bg-opacity-5 text-white text-opacity-70 hover:text-white text-xs font-medium transition-all duration-300 hover:shadow-xl no-underline"
            >
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"
                />
              </svg>
              <span>TikTok</span>
            </a>

            <!-- Messenger -->
            <a
              href="#"
              class="social-btn btn-messenger flex flex-col items-center justify-center gap-1.5 py-3 px-1 rounded-xl border border-white border-opacity-10 bg-white bg-opacity-5 text-white text-opacity-70 hover:text-white text-xs font-medium transition-all duration-300 hover:shadow-xl no-underline"
            >
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M12 0C5.373 0 0 4.974 0 11.111c0 3.498 1.744 6.614 4.469 8.654V24l4.088-2.242c1.092.3 2.246.464 3.443.464 6.627 0 12-4.975 12-11.111S18.627 0 12 0zm1.191 14.963l-3.055-3.26-5.963 3.26L10.732 8.4l3.131 3.259L19.752 8.4l-6.561 6.563z"
                />
              </svg>
              <span>Messenger</span>
            </a>

            <!-- WhatsApp -->
            <a
              href="#"
              class="social-btn btn-whatsapp flex flex-col items-center justify-center gap-1.5 py-3 px-1 rounded-xl border border-white border-opacity-10 bg-white bg-opacity-5 text-white text-opacity-70 hover:text-white text-xs font-medium transition-all duration-300 hover:shadow-xl no-underline"
            >
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"
                />
              </svg>
              <span>WhatsApp</span>
            </a>
          </div>
        </div>
      </div>

      <div class="p-8 md:p-10 flex flex-col gap-5">
        <div>
          <h2 class="font-serif text-2xl md:text-3xl font-medium text-ink mb-1">
            Send a message
          </h2>
          <p class="text-ink-muted text-sm">
            Fill in the form and we'll get back to you shortly.
          </p>
        </div>

        <!-- Name -->
        <div class="flex flex-col gap-1.5">
          <label
            for="name"
            class="text-xs font-semibold text-ink-light uppercase tracking-wider"
            >Your Name</label
          >
          <input
            id="name"
            type="text"
            placeholder="Your Name"
            class="w-full px-4 py-3 rounded-xl border border-stone-200 bg-cream text-ink text-sm placeholder-ink-muted outline-none transition-all duration-200 focus:border-accent focus:bg-white focus:ring-4 focus:ring-orange-100"
          />
        </div>

        <!-- Email -->
        <div class="flex flex-col gap-1.5">
          <label
            for="email"
            class="text-xs font-semibold text-ink-light uppercase tracking-wider"
            >Email Address</label
          >
          <input
            id="email"
            type="email"
            placeholder="you@gmail.com"
            class="w-full px-4 py-3 rounded-xl border border-stone-200 bg-cream text-ink text-sm placeholder-ink-muted outline-none transition-all duration-200 focus:border-accent focus:bg-white focus:ring-4 focus:ring-orange-100"
          />
        </div>

        <!-- Subject -->
        <div class="flex flex-col gap-1.5">
          <label
            for="subject"
            class="text-xs font-semibold text-ink-light uppercase tracking-wider"
            >Subject</label
          >
          <input
            id="subject"
            type="text"
            placeholder="What's this about?"
            class="w-full px-4 py-3 rounded-xl border border-stone-200 bg-cream text-ink text-sm placeholder-ink-muted outline-none transition-all duration-200 focus:border-accent focus:bg-white focus:ring-4 focus:ring-orange-100"
          />
        </div>

        <!-- Message -->
        <div class="flex flex-col gap-1.5">
          <label
            for="message"
            class="text-xs font-semibold text-ink-light uppercase tracking-wider"
            >Message</label
          >
          <textarea
            id="message"
            rows="4"
            placeholder="Write your message here..."
            class="w-full px-4 py-3 rounded-xl border border-stone-200 bg-cream text-ink text-sm placeholder-ink-muted outline-none transition-all duration-200 focus:border-accent focus:bg-white focus:ring-4 focus:ring-orange-100 resize-none"
          ></textarea>
        </div>

        <!-- Send button -->
        <button
          id="sendBtn"
          onclick="handleSend()"
          class="send-btn w-full flex items-center justify-center gap-2 py-3.5 px-6 bg-accent hover:bg-accent-hover text-white text-sm font-semibold rounded-xl transition-all duration-300 hover:shadow-lg cursor-pointer border-none"
        >
          <svg
            class="w-4 h-4 fill-white"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
          >
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
          </svg>
          Send Message
        </button>
      </div>
    </div>
  </body>
</html>
